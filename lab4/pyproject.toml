[project]
name = "lab4-machine-translation"
version = "1.0.0"
description = "ЛР №4: автоматический машинный перевод текстов (англо-французский, система с трансфером)"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "psycopg2-binary>=2.9",
    "spacy>=3.8,<3.9",
    "en-core-web-sm",
    "python-docx>=1.1",
    "pdfplumber>=0.11",
]

[tool.uv]
# Проект может лежать в папке OneDrive: жёсткие ссылки из кэша uv там невозможны (os error 396)
link-mode = "copy"
package = false

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "playwright>=1.45",
    "matplotlib>=3.8",
]
