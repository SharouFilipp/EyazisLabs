[project]
name = "lab3-summarizer"
version = "1.0.0"
description = "ЛР №3: автоматическое реферирование документов (sentence extraction + OSTIS), французский и итальянский языки"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "snowballstemmer>=2.2",
    "psycopg2-binary>=2.9",
]

[dependency-groups]
dev = [
    "reportlab>=4.0",
    "matplotlib>=3.8",
    "playwright>=1.45",
    "httpx>=0.27",
]

[tool.uv]
# Проект лежит в папке OneDrive: жёсткие ссылки из кэша uv там невозможны (os error 396)
link-mode = "copy"
package = false
